# 11/4 강의실 시연 시뮬 파라미터. 모든 값은 [가정값]이며 강의실 답사·실측 뒤 바꾼다.
# 좌표계(plan.md 2절과 같음): 원점 = A쪽 아래 모서리, x = A → B, y = 관객 쪽 → 안쪽. 지도 좌표 = Gazebo 월드 좌표.
# 로봇·팔·리프트·팔레트·버튼판·카메라 치수는 sim/real_maps/world_params.yaml 을 그대로 쓴다(복사하지 않음).
schema_version: 1
validation_scope: simulation

area: [5.0, 2.0]                       # 시연 구역 (바닥 테이프)
partition: {thickness_m: 0.05, height_m: 1.2, y_range: [-0.2, 2.2]}   # A(x=0)·B(x=5) 끝벽 칸막이
classroom:                             # 강의실 벽(위치 추정용 LiDAR 기준). 측면은 열려 있고 책상만 있다
  x_range: [-1.5, 6.6]
  y_range: [-3.2, 4.4]
  wall_height_m: 1.0
  wall_thickness_m: 0.10
  # 책상 [중심 x, 중심 y, 크기 x, 크기 y] (높이 0.72 m 상자, LiDAR 장애물). 관객석(y<0)과 뒤쪽(y>2)
  desks:
    - [0.6, -1.4, 1.2, 0.5]
    - [2.5, -1.4, 1.2, 0.5]
    - [4.4, -1.4, 1.2, 0.5]
    - [1.5, -2.5, 1.2, 0.5]
    - [3.5, -2.5, 1.2, 0.5]
    - [1.0, 3.3, 1.2, 0.5]
    - [4.0, 3.3, 1.2, 0.5]
  desk_height_m: 0.72
  source: "[가정값] 강의실 약 8 × 7.6 m, 책상 1.2 × 0.5 m. 실제 강의실 미정(plan.md 결정 9)"

poses:                                 # [x, y, yaw_rad] 지도 좌표
  start: [2.5, 1.0, 3.14159265]        # S: A쪽을 보고 시작
  a_approach: [1.2, 1.0, 3.14159265]   # A 접근점: A벽을 보고 도착(회전 없이 훑기)
  b_call_view: [4.0, 1.6, 0.0]         # 호출 버튼판 1 m 앞
  b_floor_view: [4.0, 0.6, 0.0]        # 층 버튼판 1 m 앞
  drop_predock: [1.24, 1.35, 3.14159265]   # P1 원래 자리 앞(팔레트 앞면에서 약 0.85 m)
  end: [2.5, 1.0, 3.14159265]          # 복귀점 = S

parcels:                               # 팔레트 바닥 중심. 포켓은 +x(B쪽)를 향함 → 팔레트 yaw = pi
  pallet_yaw: 3.14159265
  storage_zone: {x: [0.0, 0.8], y: [0.2, 1.8]}   # A 보관 구역(바닥 테이프). 이 안에서 본 택배만 후보
  storage_zone_source: "2026-10-14 시뮬: 갈색 책상(로봇 오른쪽 뒤)을 택배로 검출해 '가장 오른쪽' 규칙이 책상을 고름 → 보관 구역 안 검출만 사용"
  items:
    - {name: P1, xy: [0.25, 1.35], label: '402'}   # 로봇 기준 가장 오른쪽 → 기존 규칙상 집는 택배
    - {name: P2, xy: [0.25, 0.65], label: '310'}
  label:
    size_m: [0.28, 0.18]               # 흰 라벨 [가로, 세로], 택배에서 로봇을 향한 면 가운데(면 0.30 × 0.20 m 를 거의 채움)
    glyph_m: [0.070, 0.120]            # 굵은 숫자 한 글자 [가로, 세로] (라벨 가장자리 흰 여백 2 cm 이상)
    stroke_m: 0.018
    gap_m: 0.014
    source: "[가정값] plan.md 송장 규격(흰 바탕 검은 굵은 숫자 3자리). 2026-10-14 시뮬: 6 × 10 cm 글자는 320×240 카메라에서 글자 15 px 라 획 판정이 경계값에 걸림 → A5 크기 라벨에 7 × 12 cm 글자(가장자리 여백 2 cm: 여백이 좁으면 흐림 때 흰 라벨이 글자에 잘려 판독 실패). 시뮬 글꼴은 획이 이어진 블록 숫자"

boards:                                # B벽(x = 5.0) 버튼판 가운데 y. 높이는 누르기 사이클 팔 끝(정운동학)에 맞춰 생성기가 정한다
  call_y: 1.6                          # 호출판 ▲(윗줄)·▼(아랫줄)
  floor_y: 0.6                         # 층 버튼판 1 2(윗줄) / 3 4(아랫줄)
  spacing_source: "2026-10-14 시뮬: 두 판을 0.45 m 간격(y 1.45 / 1.0)에 두면 호출 버튼을 찾을 때 예상 위치 0.6 m 안의 층 버튼판 캡까지 후보가 되어 층 버튼을 ▲로 잘못 눌렀음. 1 m 간격으로 둔다"
  low_row_dz_m: {call: 0.0845, destination: 0.080}   # 윗줄 캡과 아랫줄 캡 높이 차(world_params dressing.demo_buttons)

display:                               # 층수 화면(운영자 대신 시뮬 노드가 숫자를 바꿈)
  y_face: 0.12                         # 화면 앞면 y (로봇 쪽 = +y 를 향함)
  size_m: [0.30, 0.18]
  digit_height_m: 0.12
  stand_m: [0.30, 0.06]                # 거치대 바닥 크기(충돌체, LiDAR가 봄)
  nominal_robot_x: 4.30                # 화면을 볼 때 로봇이 서 있을 x, y(위치·높이 계산용: 층 버튼 누른 뒤 후진한 자리)
  nominal_robot_y: 0.72
  source: "[가정값] 화면 중심은 층수 보기 자세(display_view)의 카메라 축이 화면 면과 만나는 점에 둔다(plan.md: 화면 높이 = floor_view 시선 높이)"

camera:                                # 팔 끝 카메라 해상도·주기(강의실 시뮬만). 화각·장착은 world_params arm.camera 그대로
  width: 640
  height: 480
  update_rate_hz: 2
  rate_source: "2026-10-14 시뮬: 640×480 을 6 Hz 로 최대 배속(약 10배)에서 받으면 초당 57장이 파이썬 노드를 막아 시계·관절 콜백이 밀리고, 정지 중 캐스터 크리프(0.55 mm/s)가 누르는 동안 12 cm 쌓여 버튼을 못 누름 → 3 Hz, 기본 3배속. 3배속에서도 러너 노드가 영상·TF·관절 메시지에 밀려 팔 동작 확인이 시뮬 36 s 걸리고 그동안 차체가 4 cm 밀려 층 버튼을 못 누름 → 2 Hz, 기본 1배속(실제 소요 시간 측정 겸)"
  source: "[가정값] world_params 는 건물 시뮬 렌더링 부하 때문에 320×240. 강의실 월드는 가벼워 640×480(실물 웹캠·floor_reader 는 1280×720 급)"

elevator:
  initial_floor: 1
  floor_step_s: 2.0                    # 층당 숫자 바뀌는 시간(plan.md 층당 약 2 s)
  source: "[가정값] 실물은 운영자가 로봇이 누른 숫자 키를 입력. 시뮬은 팔 끝이 층 버튼 캡에 닿으면 바로 진행"

reading:
  label_frames: 3                      # 송장: 같은 번호 새 프레임 3개 연속
  floor_frames: 5                      # 층수: 같은 숫자 새 프레임 5개 연속
  floor_timeout_s: 60
  min_segment_confidence: 0.25        # 각 획 자리가 켜짐/꺼짐으로 분명한 정도(0~1)의 최저값
  valid_first_digits: ['2', '3', '4']
  source: "plan.md 송장 층수 규칙·층수 화면 확인 기준"
