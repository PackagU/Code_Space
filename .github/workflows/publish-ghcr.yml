name: Publish ROS2 Humble SLAM image

on:
  push:
    branches: [main]
    # 이미지 정의가 바뀔 때만 재빌드 (docker/ = 컨테이너 SSOT)
    paths:
      - "docker/**"
      - ".github/workflows/publish-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/packagu/ros2-humble-slam

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=humble
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          # Code_Space 레이아웃: 컨테이너 정의는 docker/ 폴더가 SSOT
          context: docker
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Jetson 실기용 aarch64 이미지 (GUI 제외) — Roadmap 07 1단계 / 실측 스펙 §3
  publish-jetson:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.jetson
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:humble-jetson
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-jetson

      - name: QEMU smoke — slam_toolbox/rplidar 패키지 존재 (스펙 §3 게이트)
        run: |
          docker run --rm --platform linux/arm64 ${{ env.IMAGE_NAME }}:humble-jetson \
            bash -lc "source /opt/ros/humble/setup.bash && ros2 pkg list | grep -E 'slam_toolbox|rplidar'"
