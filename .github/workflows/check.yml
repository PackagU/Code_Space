name: check

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install python deps
        run: pip install pyyaml py_trees

      - name: Bootstrap generated assets (worlds + maps)
        run: bash scripts/bootstrap_workspace.sh

      - name: Run offline test suite
        run: bash scripts/run_offline_tests.sh
