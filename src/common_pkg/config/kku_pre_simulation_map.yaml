schema_version: 1
map_name: kku_engineering_virtual_pre_sim
reference_building: Konkuk University Engineering Building
purpose: pre_simulation_slam_and_elevator_delivery

coordinate_system:
  unit: meter
  frame_per_floor: true
  per_floor_frame_ids:
    F1: map_f1
    F2: map_f2
    F3: map_f3
  origin:
    description: center of the elevator interior on each floor
    x: 0.0
    y: 0.0
  axes:
    positive_x: right_corridor_direction_from_elevator
    positive_y: back_corridor_direction_after_left_turn
  yaw_zero: positive_x

global_defaults:
  wall_height: 2.4
  wall_thickness: 0.12
  corridor_width: 2.0
  room_door_width: 0.9
  elevator_door_width: 1.0
  parcel_zone_door_width: 1.0  # 실측 전 가정치 — 0.9에서 조정, 근거는 improvement_report §1.25
  elevator_inner_size:
    x: 1.6
    y: 1.6
  room_size:
    width_along_corridor: 2.5
    depth_into_wall: 3.0
  room_door_depth_marker: 0.08
  lidar_test_max_range: 8.0
  recommended_map_resolution: 0.05

floors:
  - id: F1
    label: 1F_parcel_pickup_floor
    role: parcel_pickup_and_elevator_transfer
    frame_id: map_f1
    elevator:
      center: {x: 0.0, y: 0.0}
      inner_size: {x: 1.6, y: 1.6}
      door:
        side: east
        center: {x: 0.8, y: 0.0}
        width: 1.0
      staging_pose_inside: {x: 0.0, y: 0.0, yaw_deg: 0.0}
      exit_pose: {x: 1.6, y: 0.0, yaw_deg: 0.0}
    corridors:
      - id: f1_right_corridor
        type: straight
        centerline:
          start: {x: 0.8, y: 0.0}
          end: {x: 15.0, y: 0.0}
        width: 2.0
        closed_ends: [end]
        notes: no_rooms_on_this_corridor_parcel_alcove_attached_south
      - id: f1_back_corridor
        type: straight
        centerline:
          start: {x: 2.0, y: 0.0}
          end: {x: 2.0, y: 8.0}
        width: 2.0
        closed_ends: [end]
        notes: form_only_no_rooms_for_slam_consistency
    parcel_zone:
      id: f1_parcel_zone
      description: alcove south of right corridor, connected via 0.9m door
      shape: alcove
      area:
        center: {x: 5.0, y: -1.8}
        size: {x: 3.0, y: 1.8}
      enclosure:
        door:
          side: north
          center: {x: 5.0, y: -0.9}
          width: 0.9
        outer_walls: [south, east, west]
      access_pose: {x: 5.0, y: -0.6, yaw_deg: -90.0}
      pickup_pose: {x: 5.0, y: -1.4, yaw_deg: -90.0}
    landmarks:
      - id: f1_parcel_shelf_a
        type: low_box_obstacle
        center: {x: 4.4, y: -2.1}
        size: {x: 0.8, y: 0.35, z: 0.6}
      - id: f1_parcel_shelf_b
        type: low_box_obstacle
        center: {x: 5.6, y: -2.1}
        size: {x: 0.8, y: 0.35, z: 0.6}

  - id: F2
    label: 2F_delivery_floor
    role: delivery
    frame_id: map_f2
    elevator:
      center: {x: 0.0, y: 0.0}
