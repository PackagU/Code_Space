elevator_transfer_model:
  initial_implementation: logical_floor_switch
  reason: Gazebo cannot run true multi-floor navigation cheaply in the first milestone.
  behavior:
    - robot_enters_elevator_at_current_floor
    - elevator_door_closes
    - target_floor_state_is_selected
    - simulation_switches_world_or_respawns_robot_at_target_floor_elevator
    - elevator_door_opens
    - robot_exits_to_target_floor_corridor
  later_extension:
    - add animated elevator doors
    - add elevator cabin model
    - add floor indicator topic
    - replace respawn with continuous 3D elevator if needed

recommended_test_routes:
  - id: parcel_to_201
    steps:
      - start: F1.elevator.exit_pose
      - visit: F1.parcel_zone.pickup_pose
      - visit: F1.elevator.staging_pose_inside
      - transfer_to: F2
      - visit: F2.room.201.approach_pose
  - id: parcel_to_208
    steps:
      - start: F1.elevator.exit_pose
      - visit: F1.parcel_zone.pickup_pose
      - visit: F1.elevator.staging_pose_inside
