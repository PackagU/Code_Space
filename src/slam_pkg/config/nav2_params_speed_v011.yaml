controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # P1 graceful degradation: 부하로 제어가 잠깐 막혀도 바로 실패하지 않게 여유 확대.
    # 2026-07-03: 1.0 -> 45.0. 좁은 문(엘베 1.0m/택배 0.9m) 앞을 보행자가 지나는 동안
    # RPP 가 collision ahead 예외를 던지는데 1초 만에 "patience exceeded" ABORTED 됐다.
    # 보행자 순찰 주기(최대 ~34s)를 기다릴 수 있게 확대 — 사람 공존 환경 전제 튜닝.
    failure_tolerance: 45.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # P1: 부하 지터로 잠깐 느려져도 recovery spin 으로 안 빠지게 진행 판정 시간 확대.
      # 2026-07-03: 30 -> 60. failure_tolerance 45s 대기 중 progress checker 가
      # 먼저 발동해 recovery 로 빠지지 않게 대기 상한보다 길게 둔다.
      movement_time_allowance: 60.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20  # 2026-09-13 도착 부근 회전 반복 완화
      yaw_goal_tolerance: 0.15
    # Option B: Regulated Pure Pursuit (RPP) 컨트롤러.
    # DWB(제자리 회전 위주 -> 직각 느낌) 대신 경로를 부드럽게 추종한다.
    # 전역 planner 는 NavFn 유지(거친 grid 경로). RPP 의 lookahead 가 추종을 매끈하게,
    # 곡률/비용 기반 감속이 좁은 코너·벽 근처에서 자동 감속해 벽 충돌을 줄인다.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 30rpm wheel limit에서 곡선 주행 여유를 남긴 현장 저속 [제안값].
      desired_linear_vel: 0.11  # 2026-09-15 [제안값] 증속 후보 v011: v0.11+w0.22 → 바깥 바퀴 45.6 rpm (48 rpm 상한). 현장 승인 전 기본값 아님
      # lookahead: 속도에 비례한 가변 전방주시(코너에선 짧게->정확, 직선에선 길게->부드럽게)
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      transform_tolerance: 0.5  # P1: TF 지연(extrapolation) 흡수 -> 부하 시 제어 끊김 완화
      # 목표 접근 시 감속
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      # 보행자 등 동적 장애물: carrot 까지 충돌 예측되면 감속/정지(실기 동적 회피 연습)
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # 곡률 기반 감속: 회전 반경이 작으면(좁은 코너) 선속도를 줄여 부드럽고 안전하게
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      # 비용 기반 감속: 인플레이션 비용이 높은(벽 근처) 곳에서 감속 -> 벽 충돌 완화
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0   # costmap inflation cost_scaling_factor 와 동기 (2026-08-21)
      # 차동 구동: 경로 시작/목표에서 헤딩 정렬을 위해 제자리 회전 사용(좁은 alcove 180° 대응)
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.22
      max_angular_accel: 0.6
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.033, 0.219], [0.033, -0.219], [-0.327, -0.219], [-0.327, 0.219]]"  # r1 v2 섀시(x -0.327~0.033)+바퀴 외측 0.2186. 외접 약 0.39m
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 2026-08-21: 0.30/5.0 -> 0.55/3.0 (적대 리뷰 C 대안 D). footprint 내접 0.27 로 정정한 뒤
        # inflation 0.30 은 그래디언트 밴드가 3cm 뿐이라 플래너가 장애물 inflation 가장자리(중심
        # 0.52m)까지 붙어 경로를 내고 RPP 가 코너를 깎다 충돌(G004 run3: 정적 장애물 (3.3,0) 옆
        # y=0.48 에서 collision ahead 3회). 밴드를 0.28m 로 넓혀 경로가 장애물에서 떨어지게 한다.
        # 문 1.0m 중앙 비용 ≈127(<253) 로 통과 가능, 뒤 복도(3m)+중앙 정적 장애물도 중심 자유폭 0.74m.
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      # 2026-09-12: VoxelLayer -> ObstacleLayer. 센서가 2D LaserScan 하나뿐인데
      # z_voxels 16 짜리 3D 복셀 그리드를 매 주기 갱신하느라 CPU 를 낭비했다.
      # global_costmap 은 원래부터 ObstacleLayer 다. 관측 계약은 그대로 유지한다.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # 2026-09-12: True -> False. 매 주기 전체 코스트맵 재전송 대신 변경분만 보낸다.
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      footprint: "[[0.033, 0.219], [0.033, -0.219], [-0.327, -0.219], [-0.327, 0.219]]"  # r1 v2 섀시(x -0.327~0.033)+바퀴 외측 0.2186. 외접 약 0.39m
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 2026-08-21: 0.30/5.0 -> 0.55/3.0 (적대 리뷰 C 대안 D). footprint 내접 0.27 로 정정한 뒤
        # inflation 0.30 은 그래디언트 밴드가 3cm 뿐이라 플래너가 장애물 inflation 가장자리(중심
        # 0.52m)까지 붙어 경로를 내고 RPP 가 코너를 깎다 충돌(G004 run3: 정적 장애물 (3.3,0) 옆
        # y=0.48 에서 collision ahead 3회). 밴드를 0.28m 로 넓혀 경로가 장애물에서 떨어지게 한다.
        # 문 1.0m 중앙 비용 ≈127(<253) 로 통과 가능, 뒤 복도(3m)+중앙 정적 장애물도 중심 자유폭 0.74m.
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      # 2026-09-12: True -> False. 매 주기 전체 코스트맵 재전송 대신 변경분만 보낸다.
      always_send_full_costmap: False

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    # Option A: Smac 2D 전역 planner (NavFn 대체).
    # grid 기반이지만 내장 smoother 로 경로를 곡선으로 다듬어 RPP 가 더 부드럽게 추종한다.
    # 차동 구동(제자리 회전 가능)이라 2D 모델로 충분하고 연산도 가볍다(Jetson 적합).
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25                 # goal 근처 이 거리 안이면 경로 성공 처리
      allow_unknown: false            # 실차 기본: 매핑되지 않은 영역으로 계획 금지
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0          # 계획 시간 상한(초)
      cost_travel_multiplier: 2.0     # 벽에서 떨어진 중앙 경로 선호 -> 벽 충돌 완화
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3                 # 경로 매끄러움 가중
        w_data: 0.2                   # 원경로 추종 가중
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5  # P1: 부하 시 recovery 동작도 TF 지연 흡수
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.20
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.8

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # 0.05m/s + 0.20rad/s 동시 명령도 30rpm 아래(약 29.4rpm)다.
    max_velocity: [0.11, 0.0, 0.22]
    min_velocity: [-0.11, 0.0, -0.22]
    max_accel: [0.3, 0.0, 0.6]
    max_decel: [-0.5, 0.0, -0.8]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
