slam_toolbox:
  ros__parameters:
    # 운영 모드: mapping (맵 생성) 또는 localization (기존 맵에서 위치 추정)
    mode: mapping

    # 맵 파라미터 (RPLiDAR A1m8 기준)
    resolution: 0.05         # 맵 해상도 [m/cell]. 성능 문제 시 0.1 시도
    max_laser_range: 8.0     # RPLiDAR A1 최대 12m, 실내 8m 권장
    minimum_travel_distance: 0.5   # 새 스캔 추가 최소 이동거리 [m]
    minimum_travel_heading: 0.5    # 새 스캔 추가 최소 회전량 [rad]

    # 루프 클로저
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_response_fine: 0.1

    # 좌표계
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    # 스캔 매칭
    use_scan_matching: true
    use_scan_barycenter: true

    # 맵 저장 경로: mapping 모드에서는 불필요해 기본 비활성.
    # localization / 이어서 매핑 시에만 launch 파라미터로 경로를 override 할 것.
    # (컨테이너 /ros2_ws 절대경로 하드코딩 금지 — Jetson 이식성 정책)
    # map_file_name: <serialized posegraph 경로>
    map_start_at_dock: false

    # 스레드
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
