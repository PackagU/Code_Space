<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="packagu-token" content="__PACKAGU_TOKEN__">
  <title>PACKAGU 현장 주행 콘솔</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">P</span>
      <div>
        <strong>PACKAGU</strong>
        <span>현장 주행 콘솔</span>
      </div>
    </div>
    <div class="status-strip" aria-live="polite">
      <span id="connectionBadge" class="badge bad">연결 확인 중</span>
      <span id="modeBadge" class="badge neutral">대기</span>
      <span id="scanBadge" class="badge neutral">LiDAR —</span>
      <span id="odomBadge" class="badge neutral">Odom —</span>
      <span id="driveBadge" class="badge neutral">구동 —</span>
    </div>
    <button id="emergencyStop" class="stop-button" type="button">소프트 정지</button>
  </header>

  <main class="workspace">
    <section class="map-panel" aria-label="실시간 지도">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">LIVE OCCUPANCY GRID</p>
          <h1>복도 지도</h1>
        </div>
        <div class="map-tools">
          <label class="tool-option"><input type="radio" name="mapTool" value="pose" checked> 초기 위치</label>
          <label class="tool-option"><input type="radio" name="mapTool" value="goal"> 목표 지점</label>
          <label class="yaw-control">방향 <input id="yawInput" type="number" value="0" min="-180" max="180" step="5">°</label>
        </div>
      </div>
      <div id="mapStage" class="map-stage">
        <canvas id="mapCanvas" width="960" height="640" aria-label="실시간 SLAM 지도. 클릭해 초기 위치 또는 목표를 지정합니다."></canvas>
        <div id="mapEmpty" class="map-empty">
          <span class="radar" aria-hidden="true"></span>
          <strong>지도를 기다리는 중</strong>
          <span>베이스 확인 후 매핑 시작을 누르세요.</span>
        </div>
        <div class="map-legend" aria-hidden="true">
          <span><i class="free"></i>이동 가능</span>
          <span><i class="wall"></i>벽</span>
          <span><i class="unknown"></i>미탐색</span>
        </div>
      </div>
      <div class="map-footer">
        <span id="mapMeta">지도 없음</span>
        <span id="pointerMeta">지도를 클릭해 위치를 선택하세요</span>
      </div>
    </section>

    <aside class="control-column">
      <section class="card phase-card">
        <div class="card-title">
          <div><span class="step-number">01</span><h2>매핑</h2></div>
          <span id="mappingState" class="state-text">정지</span>
        </div>
        <div class="field-row">
          <label>층
            <select id="floorSelect">
              <option value="F1">F1</option>
              <option value="F2">F2</option>
              <option value="F3">F3</option>
            </select>
          </label>
          <label class="grow">지도 이름
            <input id="mapName" type="text" maxlength="40" placeholder="자동 생성">
          </label>
        </div>
        <div class="button-row">
          <button id="startMapping" class="primary" type="button">매핑 시작</button>
          <button id="stopMapping" class="secondary" type="button">저장하고 끝내기</button>
        </div>
      </section>

      <section class="card phase-card">
        <div class="card-title">
          <div><span class="step-number">02</span><h2>네비게이션</h2></div>
          <span id="navigationState" class="state-text">정지</span>
        </div>
        <label>저장 지도
          <select id="mapSelect"><option value="">저장 지도를 선택하세요</option></select>
        </label>
        <div class="button-row">
          <button id="startNavigation" class="primary" type="button">지도 열기</button>
          <button id="stopNavigation" class="secondary" type="button">네비게이션 종료</button>
        </div>
        <div class="target-box">
          <span id="targetText">지도에서 위치를 선택하세요.</span>
          <button id="sendTarget" type="button" disabled>선택 지점 적용</button>
        </div>
      </section>

      <section class="card drive-card">
        <div class="card-title">
          <div><span class="step-number">03</span><h2>수동 주행</h2></div>
          <span class="state-text">30 RPM 제한</span>
        </div>
        <p class="hint">화면을 클릭한 뒤 WASD를 누르세요. 키를 놓으면 정지합니다.</p>
        <div class="drive-grid" aria-label="수동 주행 버튼">
          <button class="drive-key up" data-drive="forward" type="button"><kbd>W</kbd><span>전진</span></button>
          <button class="drive-key left" data-drive="left" type="button"><kbd>A</kbd><span>좌회전</span></button>
          <button class="drive-key stop" data-drive="stop" type="button"><kbd>Space</kbd><span>정지</span></button>
          <button class="drive-key right" data-drive="right" type="button"><kbd>D</kbd><span>우회전</span></button>
          <button class="drive-key down" data-drive="backward" type="button"><kbd>S</kbd><span>후진</span></button>
        </div>
        <div class="velocity-readout">
          <span>수동 선속도 <strong>0.10 m/s</strong></span>
          <span>회전속도 <strong>0.35 rad/s</strong></span>
        </div>
      </section>

      <div id="notice" class="notice" role="status" aria-live="polite">베이스 상태를 확인하고 있습니다.</div>
    </aside>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
