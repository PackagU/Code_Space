# R1B 지면 캘리브레이션에서 확정 후 갱신 (스펙 §5.5)
# 초기값 근거: docs/hardware_spec.md §1.3 (바퀴 지름 0.066m, 간격 0.51324m)
packagu_opencr_bridge:
  ros__parameters:
    wheel_radius: 0.033
    wheel_separation: 0.51324
    left_sign: 1.0
    right_sign: 1.0
    cmd_timeout_sec: 0.5
    cmd_rate_hz: 20.0
    # 아래 안전 한계와 covariance는 H01/H02 실측 전 [제안값].
    feedback_timeout_sec: 0.5
    max_feedback_dt_sec: 0.25
    max_linear_speed: 0.25
    max_angular_speed: 1.0
    max_wheel_rpm: 30.0
    max_wheel_accel_rpm_s: 60.0
    require_feedback_before_motion: true
    publish_tf: true  # EKF를 추가하기 전에는 bridge가 odom->base_footprint 단일 발행자
