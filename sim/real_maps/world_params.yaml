# 같은지 검사하고 다르면 멈춘다.
dressing:
  demo_buttons:
    car_board_m: [0.205, 0.16]
    car_caps: [["1", -0.049, 0.040], ["2", 0.049, 0.040], ["3", -0.049, -0.040], ["4", 0.049, -0.040]]
    hall_board_m: [0.135, 0.205]
    hall_caps: [["UP", 0.0, 0.025], ["DOWN", 0.0, -0.0595]]
    cap_diameter_m: 0.055
    cap_height_m: 0.02
    board_thickness_m: 0.005
    sim_mount_block_m: 0.03
    source: "사용자 2026-10-13 시연 버튼 사진·치수: 층 버튼판 가로 20.5 x 세로 16 cm(위 1 2, 아래 3 4), 승하차 버튼판 가로 13.5 x 세로 20.5 cm(위 ▲, 아래 ▼). 검은 판·흰 원형 캡·검은 숫자/삼각형. 캡 위치 [오른쪽, 위](판을 마주 본 사람 기준, 판 중심에서 m)·지름 약 5.5 cm·높이 약 2 cm 는 사진 비율 [사진 추정]. 층 버튼판은 엘리베이터 내부 기준 왼쪽 벽, 승하차 버튼판은 승강장에서 볼 때 문 오른쪽"
    height_source: "사용자 2026-10-13: 높이는 젯슨에 넣어 둔 버튼 각도로 누를 수 있는 위치. servo_protocol.py(6107e25, 젯슨 작업 트리 2026-09-13) 사이클의 누름 유지 자세를 가정 팔 기하로 정운동학해 층 버튼판은 1·2 줄, 승하차 버튼판은 로비 ▲·목표층 ▼ 캡 중심을 그 팔 끝 높이에 둔다(약 0.68 m). 가로 위치는 로봇이 그 사이클로 누르는 자세에서 캐빈 정지점과 같은 줄에 서도록. 가정 대응(U-H04)이 틀리면 높이도 틀림"
  floor_display:
    width_m: 0.30
    height_m: 0.18
    center_z_m: 1.13
    source: "사용자 2026-10-12: 층수 확인 화면은 엘리베이터 입구 위. 높이·크기는 [가정값](시뮬 벽 1.0 m 위 문틀 위에 붙임). 숫자는 /elevator/state 의 층을 7-세그먼트로 표시"
  hall_panel_offset_m: 0.25
  hall_panel_side: {F1: right, F2: right, source: "사용자 2026-10-13: F2 잡음 제거·벽 평탄화 후 양 층 호출판 오른쪽 복원"}
  hall_panel_source: "사용자 2026-10-13: 탈 때 누르는 호출 버튼은 엘리베이터 오른쪽(승강장에서 엘리베이터를 볼 때). 로비(F1)는 올라가기, 목표층(F2)은 내려가기. 문 가장자리에서 0.25 m 옆·높이는 [가정값]. 실제 위치·높이 아직 모름"
  handrail_z_m: 0.85
  handrail_source: "[가정값] 캐빈 뒷벽 손잡이. 실제 유무·높이 아직 모름"
  cabin_region_radius_m: 1.7
  cabin_region_source: "지도 기하. 캐빈 기준 waypoint 에서 자유 셀을 채워 바닥·벽 마감 위치를 정함(문 선 ±0.08 m 는 막음)"
  pickup_marking_margin_m: 0.10
  pickup_prior_source: "로봇이 아는 사전 정보(티칭값 가정): 택배 구역은 f1_locker 로 들어가는 방향 오른쪽. 정확한 위치는 카메라로 찾는다"
  pickup_source: "[가정값] 보관함 대신 바닥 픽업 구역 표시(노란 테이프). 팔레트 둘레 0.10 m 여유"

# --arm-sim 로봇 쪽 인식(perception.py)과 버튼·팔레트 동작(skills.py). 지면 진실은 평가에만 쓴다.
perception:
  hsv:
    parcel: [[[8, 90, 50], [22, 200, 255]]]
    pallet: [[[50, 90, 40], [85, 255, 255]]]
    button: [[[0, 0, 110], [180, 70, 255]]]
