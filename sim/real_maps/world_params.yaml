# 실측 지도 Gazebo 월드 치수 (시뮬 전용, 2026-10-08)
#
# generate_worlds.py 는 월드 치수를 이 파일에서만 읽는다. 토요일(10/10) 현장 측정 뒤에는
# 값과 source 만 바꾸고 `python3 sim/real_maps/generate_worlds.py` 로 다시 생성한다.
#
# source 표기
#   [측정값] 날짜·방법      : 실제로 잰 값
#   [제안값] 근거           : 시뮬을 돌리기 위해 정한 값. 실물 확인 전
#   아직 모름(임시값)       : 사실이지만 아직 확인하지 않음. 임시값으로 월드를 만든다
#   지도 기하               : 현장 지도 이미지·생성기에서 계산한 값. 로봇·줄자 측정이 아님
# 확인 대상 ID는 docs/sim_e2e_20261008/reference/final_demo/10_unknowns_register.md 의 U-E·U-H.
# 이 파일로 만든 월드의 결과에는 모두 "임시 치수"를 붙인다.
schema_version: 1
validation_scope: simulation

walls:
  height_m: 1.0
  height_source: "[제안값] 9/15 시뮬과 같은 1.0 m. LiDAR 평면(0.667 m)보다 높으면 Nav2 결과에 영향 없음. 실제 벽 높이 아직 모름"

floors:
  F1:
    nav_map: src/slam_pkg/maps/field/f1/f1_manual_clean_v3.yaml
    world_map: noglass
    world_map_source: "지도 기하. v3 에서 보관함 유리 고정문 선분 (357.3,204.5)-(383.6,204.5) 만 뺀다(9/15와 같음). LiDAR가 유리를 못 보는 상황 흉내"
    # 두 층을 한 Gazebo 월드에 둘 때 층별 world 좌표 오프셋 [x, y, z] (m). 지면 진실 평가 때 뺀다.
    world_offset: [0.0, 0.0, 0.0]
  F2:
    nav_map: src/slam_pkg/maps/field/f2/f2_nav_unknown_v1.yaml
    world_map: raw
    world_map_source: "지도 기하. f2_raw_20260914.pgm occupied 셀 그대로(잡음 유지)"
    world_offset: [100.0, 0.0, 0.0]
    world_offset_source: "[제안값] F1 x 범위 -18.5..7.1, F2 x 범위 -44.9..-0.7 → +100 m 이면 두 층 사이 48 m 이상. LiDAR 최대 8 m 보다 훨씬 멀다"
  ground_plane_m: 400.0

# F2 문 열린 리허설 변형(f2_door_open). 9/15와 같은 마스크: 통로 중심·축·폭·수직 범위 안 occupied 셀 제거.
f2_door_open:
  center: [-11.925, -1.925]
  axis_rad: 0.741948
  half_along_m: 0.5
  half_across_m: 0.4
  source: "9/15 사용자 승인 시뮬 예외. 문 영역 스캔 두께를 비울 뿐 실측 문짝 두께가 아님(9/15 결과 78셀 제거)"

elevator:
  # 승강장 문·캐빈 문을 한 쌍의 미닫이 문짝(중앙 열림)으로 근사한다. 두 문 사이 틈은 모델하지 않는다.
  door_model: "center-opening sliding leaf pair (landing+cabin door merged)"
  door_model_source: "[제안값] 09 L3 '미닫이 모델 또는 충돌체 on/off로 시작'. 실제 문 구성 U-E01·U-E06 아직 모름"
  F1:
    door_center: [-9.512178449257371, -0.9801502255194041]
    door_axis_rad: -0.37960911230876665
    door_source: "지도 기하. v3 정책 문 틈 u 234..256, v 129 의 중심(raw px 245,129)을 21.75° 회전해 계산(9/15 doors()와 같음)"
    opening_width_m: 1.10
    opening_width_source: "아직 모름(임시값) U-E01. v3 문 틈 22 px × 0.05 m"
    cabin_inner_m: [1.85, 2.0]
    cabin_source: "아직 모름(임시값) U-E01. v3 정책 사각형 u 219..256, v 129..169. 사용자 '네모' 확인, 치수는 지도 기하"
    inside_waypoint: f1_elevator_inside
  F2:
    door_center: [-11.925, -1.925]
    door_axis_rad: 0.741948
    door_source: "지도 기하. 9/15 F2 리허설 통로 중심·축(f2_elevator_entry yaw 2.312744 - pi/2)"
    opening_width_m: 1.0
    opening_width_source: "아직 모름(임시값) U-E01. 9/15 F2 리허설 통로 1.0 m 가정"
    cabin_inner_m: null
    cabin_source: "아직 모름 U-E01. raw 스캔 마름모 영역을 그대로 사용(정리 기하 없음, U-X05 미정). f2_elevator_inside 지도 이미지 여유 0.224 m"
    inside_waypoint: f2_elevator_inside
  leaf:
    thickness_m: 0.025
    height_m: 1.0
    open_overtravel_m: 0.06
    source: "[제안값] 9/15 문짝 모델과 같음. 실제 문짝 두께·높이 아직 모름(U-E01)"
  timing:
    door_open_s: 2.5
    door_close_s: 2.5
    hold_open_s: 60.0
    travel_per_floor_s: 45.0
    call_response_s: 20.0
    call_confirmation_source: "[제안값] 시뮬 호출 응답 대기 20 s: 이미 같은 층에 있는 엘리베이터의 호출 램프도 도착 처리 시 끄되, 기존 팔 카메라로 누르고 물러나 점등을 확인할 시간을 둠. 실제 엘리베이터 호출 지연의 실측값이 아님"
    visual_confirmation_source: "[제안값] 시뮬 이동 시간 45 s: 버튼을 누르고 물러나 같은 버튼 램프를 팔 카메라로 확인한 뒤 중앙으로 돌아올 시간을 둠. 실제 이동 시간 검증 아님. 관절 hold는 실제 층 위치 전환 직전 3 s부터 중지하고, 팔 쓰기 중단 확인 신호와 1 s 안정화 뒤 위치를 전환함. 이동 전체에서 중지하면 카메라 자세가 드리프트함. 목적층 도착 시 그 층 버튼 램프를 끔"
    source: "아직 모름(임시값) U-E02. 문 시간·열림 유지·층간 이동 시간은 05 T3 측정 뒤 채운다. hold_open 60 s [제안값](2026-10-13 30→60): 로봇이 팔로 호출 버튼을 누르고(후진·확인 포함) 입구 앞 대기 지점까지 와서 문 선을 지나는 데 0.08 m/s·0.3 rad/s 로 약 45 s 가 걸려 30 s 로는 문이 먼저 닫혔다. 실제 열림 유지(보통 5~10 s)가 짧으면 이 순서로는 못 탄다 → 현장 측정·열림 연장 필요"
  initial_floor: F2
  initial_floor_source: "[제안값] 첫 호출에서 '도착 대기' 단계를 거치도록 반대층에서 시작"
  reopen_on_obstruction: true
  reopen_source: "미정. 문 사이에 물체가 있을 때 다시 열리는지 아직 모름 — true/false 두 경우 모두 시험 가능"
  threshold:
    enabled: false
    gap_m: null
    step_m: null
    source: "아직 모름 U-E03 (설계 가정 약 1 cm). 현재 nav_safety_gate·nav2_params 에 문턱 감속 구간 기능이 없어 '감속 구간 동작' 시험 대상이 없다 → 넣지 않음"

locker:
  modeled: false
  source: "아직 모름 U-E07 (보관함 3칸 치수·높이·위치). 지도에 그려진 벽만 있다. 적재는 상태 표시만 바꾼다"

glass:
  f1_locker_fixed_glass: removed_from_world
  other: "아직 모름 U-E08"

lidar:
  frame: laser
  pose_xyz: [-0.117, 0.0, 0.667]
  pose_source: "URDF delivery_robot.urdf.xacro laser_x/y/z 기본값. 실물 높이 아직 모름 U-H02 (9/10 Jetson TF 옛 URDF 0.770 m)"
  update_rate_hz: 7.6
  samples: 1450
  rate_source: "RPLiDAR A1 현장 관측 약 7.6 Hz, 약 1,450 점/scan (9/15와 같음)"
  range_min_m: 0.15
  range_max_m: 8.0
  range_source: "URDF 값. RPLiDAR A1 사양 최대 12 m 와 다름(표로 기록)"
  noise_enabled: true
  noise_stddev_m: 0.01
  noise_source: "[제안값] URDF 기본 가우시안 0.01 m. 실제 bag 정지 scan 표준편차 미측정(SW2). run 인자 --lidar-noise off 로 끈다"

robot:
  footprint: [[0.033, 0.219], [0.033, -0.219], [-0.327, -0.219], [-0.327, 0.219]]
  footprint_source: "nav2_params footprint. 실제 차체 외곽 아직 모름 U-H01"
  collision_box_m: [0.360, 0.438, 0.250]
  wheel_radius_m: 0.033
  wheel_separation_m: 0.4323
  wheel_separation_source: "drive_calib.yaml 실효 윤거"
  # 새 시험 기본 = encoder(플러그인 0): 바퀴 관절 속도 적분. 엘리베이터 순간이동 때 바퀴가 돌지 않으므로
  # 실차처럼 odom 이 연속이다. world(1) 는 참값이 odom 으로 들어가고 순간이동 때 odom 도 같이 뛴다 → 9/15 재현 전용.
  odometry_source: encoder
  odometry_profiles: {encoder: 0, world: 1}
  odometry_source_note: "[제안값] 2026-10-08 Codex 검토 반영: 새 E2E·사전 시험은 encoder. 9/15 재현(run_scenarios.py)은 robot_world.urdf(world). 실차 바퀴 odom 오차 아직 모름 U-H08"
  # encoder odom 프로필에만 적용하는 볼캐스터·보조 바퀴 접촉 단순화(9/15 재현 robot_world.urdf 는 원본 접촉 유지).
  # 근거: sim/real_maps/probe_drive_slip.py 2026-10-08 (logs/real_map_sim/slip_probe_20261008{,_b}/summary.json)
  #   V0 원본(고정 구 캐스터 접지·mu 0.5): odom/참값 직진 1.25·회전 1.38 → encoder odom 으로 G1 도착 부근 회전 반복
  #   V2 보조 바퀴 2 mm·mu 0.3: 직진 1.08·회전 1.03 → 8% 직진 편향으로 G2 AMCL 이탈·벽 접촉(pre1_G2)
  #   V5 채택(뒤 볼캐스터를 x·y 두 회전 관절로 구르게, 보조 바퀴 2 mm): 직진 0.999·회전 0.965(URDF 윤거 0.4194
  #      대 drive_calib 0.4323 비 0.970 과 같음 = 미끄럼 없음), 정지 크리프 0.07~0.66 mm/s(원본 0.5 mm/s 수준)
  contact:
    front_aux_caster_lift_m: 0.002
    rear_caster: rolling_ball
    rear_caster_mu: 1.0
    front_caster_mu: 0.3
    source: "[제안값] 실제 볼캐스터는 구른다(고정 구 미끄럼 끌림 제거). 보조 바퀴 지상고 아직 모름 U-H06, 실제 바퀴 미끄럼·odom 오차 아직 모름 U-H08. 시뮬 단순화이며 실물 값이 아님"
  top_deck:
    top_z_m: 0.40
    source: "[사진 추정] 2026-10-13 옆 사진: 상판(팔 받침이 놓인 흰·검은 판) 높이 약 0.40 m(몸체 길이 0.30 m 축척). URDF 섀시(0.053~0.303 m) 위 시각 전용 상판, 충돌체 없음(팔 실행 URDF 만). 실측 아님"
  imu: none
  imu_source: "9/12 기록상 실차 IMU 미발행. 현재 상태 아직 모름 U-H09"
  ground_truth_rate_hz: 20.0

# 층 이동·지도 전환 판정 기준. 모두 [제안값] — 현장 기준 아님. run_e2e.py 인자로 덮어쓸 수 있다.
floor_transfer:
  odom_continuity_max_m: 0.02
  odom_continuity_max_rad: 0.02
  cabin_relative_pose_max_m: 0.02
  cabin_relative_pose_max_rad: 0.02
  source: "[제안값] 순간이동 전후 odom 변화(바퀴 정지 → 0 기대)와 캐빈 기준 상대 자세 보존 허용치"
relocalization:
  min_new_amcl_samples: 5
  position_error_max_m: 0.25
  yaw_error_max_rad: 0.15
  covariance_xy_max_m2: 0.05
  covariance_yaw_max_rad2: 0.05
  tf_stable_window_s: 3.0
  tf_stable_max_jump_m: 0.05
  tf_stable_max_jump_rad: 0.05
  timeout_s: 60.0
  source: "[제안값] 지도 전환 뒤 새 AMCL 표본(전환 이후 stamp)만으로 판정. 위치 0.25 m 는 9/15 S3 회복 기준과 같음. 기준 미달이면 정지·기록·중단"

# ---------------------------------------------------------------------------------------------
# 팔·지게팔·택배 상자 (시뮬 전용 옵션 --arm-sim). 모두 가정값 — 실물 동작·접촉·하중 검증이 아니다.
# ---------------------------------------------------------------------------------------------
lift:
  joint: lift_joint
  load_up_m: 0.30
  unload_up_m: 0.30
  down_m: 0.0
  tolerance_m: 0.03
  timeout_s: 30.0
  source: "[가정값] 보관함 칸·배달 위치 높이 아직 모름 U-E07·U-E11. URDF lift_joint 행정 0~0.5 m, lift_cycle.py 기본 0.30 m 재사용. 실물 리프트 원점·리미트·하중 아직 모름 U-H10"
  # 팔레트 적재 뒤 리프트 높이(--lift-stop). 택배를 너무 올리면 팔(0.70 m 장착)·팔 카메라를 가려 버튼을 못 누른다
  # (사용자 2026-10-12 실물 관찰). ultrasonic: 몸체(마스트) 앞 초음파가 택배 윗면을 보면 멈춤. fixed: 조금만 올림.
  # 지게팔 기둥·포크 위치(시뮬 전용 덮어쓰기, src URDF 는 그대로 0.165). 사진: 기둥은 몸체 앞면에 붙어 있고 포크 끝은
  # 몸체 앞면에서 약 0.22 m 앞(축 기준 0.26 m).
  mast_x_m: 0.02
  fork_tip_x_m: 0.26
  mast_source: "[사진 추정] 2026-10-13 옆 사진. URDF lead_screw_base_joint x 0.165 는 몸체 앞 0.09 m 떨어진 기둥이라 팔레트가 0.13 m 더 튀어나와 몸체 위 팔이 버튼에 닿지 않음. 기둥(두께 0.08)은 몸체 앞면에 붙어 x -0.02~0.06, 팔레트는 기둥 앞면에서 0.005 m 앞(Codex 2차: 기둥·팔레트 겹침 수정). 실측 아님"
  carry:
    mode: ultrasonic
    fixed_lift_m: 0.08
    load_top_offset_m: 0.295
    max_lift_m: 0.45
    speed_mps: 0.05
    hold_tolerance_m: 0.01
    source: "[가정값] 사용자 2026-10-12 '초음파로 택배가 일정 높이 이상 못 올라오게 하거나 지게팔을 조금만 올림'. 상승 속도·최대 높이 아직 모름(U-H10)"
  ultrasonic:
    mount_xyz: [0.062, 0.0, 0.55]
    field_of_view_rad: 0.26
    range_min_m: 0.02
    range_max_m: 4.0
    detect_range_m: 0.50
    rate_hz: 10
    source: "[가정값] 몸체 앞 지게팔 기둥(기둥 앞면 0.06 m 와 팔레트 뒷면 0.065 m 사이), 높이 0.55 m에 앞을 보는 초음파(HC-SR04 급 화각·거리). 시뮬은 가상 센서: 들고 있는 택배·팔레트 상자와의 기하 거리만 계산(벽·사람은 안 봄, Gazebo 센서 아님). 실제 장착 높이·모델 아직 모름"

arm:
  # 4 DOF 서보 팔(사양서: 리치 60 cm). 자세 PWM 은 src/robot_arm_pkg/robot_arm_pkg/servo_protocol.py 를 읽어서 쓴다(복사 안 함).
  mount_xyz: [-0.06, -0.11, 0.42]
  mount_source: "[사진 추정] 2026-10-13 사용자 사진(옆·위)과 지적('팔은 오른쪽, 공중에 뜨고 너무 앞으로 나옴'): 팔 받침 서보는 상판 오른쪽 앞. 몸체 길이 0.30 m(hardware_spec)를 축척으로 몸체 앞면에서 약 0.09 m 뒤(x -0.06), 중심에서 오른쪽 약 0.11 m(y -0.11), 상판 약 0.40 m 위 어깨축 약 0.47 m(받침 z 0.42 + 어깨 0.05). 실측 아님(improvement_report §1.17). 이전 값 [0.12, 0.15, 0.70]은 왼쪽·몸체 앞 0.09 m 허공이었음. 현장 servo_protocol.py POSES_2 주석은 '상단 좌측 장착 팔'이라 팀 확인 필요"
  joints:
    - {name: arm_joint_000, servo: '000', axis: [0, 0, 1], parent_offset: [0.0, 0.0, 0.0]}
    - {name: arm_joint_001, servo: '001', axis: [0, 1, 0], parent_offset: [0.0, 0.0, 0.05]}
    - {name: arm_joint_002, servo: '002', axis: [0, 1, 0], parent_offset: [0.25, 0.0, 0.0]}
    - {name: arm_joint_003, servo: '003', axis: [1, 0, 0], parent_offset: [0.25, 0.0, 0.0]}
  tip_offset: [0.10, 0.0, 0.0]
  geometry_source: "[가정값] 관절 축 배정(000 몸통 yaw, 001 어깨 pitch, 002 팔꿈치 pitch, 003 손목 roll)과 링크 길이 0.05/0.25/0.25/0.10 m(합 0.60 m)는 사양 리치 60 cm 를 나눈 가정. 실제 관절 배치 아직 모름"
  pwm_to_angle:
    center_us: 1500
    rad_per_us: 0.0015707963
    sign: {'000': 1, '001': 1, '002': 1, '003': 1}
    offset_rad: {'001': -0.8, '002': -0.8, source: "[사진 추정] 아래 pwm_to_angle.source 참조"}
    source: "[가정값] 표준 서보 1500 µs = 0°, ±1000 µs = ±90° (0.09°/µs). 실제 PWM→각도 대응·방향·영점 아직 모름(U-H04, Kim 확인 필요). 2026-10-13 어깨·팔꿈치 영점 -0.8 rad([사진 추정]): 사진의 접힌 자세(HOME 으로 해석)는 위팔이 거의 수직이라, 영점 0 이면 어깨가 위로 54°까지만 가서 몸체 위(어깨 0.47 m) 장착에서 버튼 누르기 거리 범위가 0.49~0.51 m 로 좁았음. -0.8 이면 HOME 위팔 82°·아래팔 47° 위(끝 0.97 m), 누르기 범위 층 버튼 0.34~0.51·호출 UP 0.30~0.48·DOWN 0.36~0.52 m"
  # 보는 자세는 미리 정한 PWM(000 받침, 001 어깨, 002 팔꿈치, 003 손목) — 필요할 때마다 계산해 겨누지 않는다(사용자 2026-10-13).
  # 모두 팔을 세운 자세(팔 끝이 장착점 앞 0.2 m 이내·높이 0.97~1.05 m, 관절 한계에서 10 µs 이상 떨어짐)이고 방향은 몸통이 맞춘다. *_press_view 는 누르기
  # 사이클과 같은 정면 받침 각도(1500)로, 누르는 자세 바로 뒤 정렬점에서 버튼을 다시 본다.
  view_poses:
    parcel_view: [1500, 910, 2581, 1500]       # 바닥 택배(몸 앞 약 1 m)
    pallet_view: [1500, 910, 2593, 1500]       # 팔레트 앞면(약 0.8 m, 화면 중심에서 13°)
    hall_view: [1500, 1002, 2250, 1500]        # 호출 버튼(1 m 앞, 높이 0.68 m)
    cabin_view: [1500, 1078, 2211, 1500]       # 캐빈 안 층 버튼(약 0.9 m)
    hall_press_view: [1500, 1015, 2313, 1500]  # 호출 버튼 정렬점, 정면 고정
    cabin_press_view: [1500, 989, 2326, 1500]  # 층 버튼 정렬점, 정면 고정
    display_view: [1500, 1498, 1422, 1500]     # 문 위 층 표시(약 1.2 m, 높이 1.13 m)
    source: "[제안값] 가정 팔 기하로 대표 거리의 대상을 화면 가운데에 두는 각도를 한 번 계산해 고정. 실제 팔은 Kim 티칭 자세(camera_views.json)로 바꿔야 함"
  press_cycle: {call: 1, destination: 2, source: "메뉴 1/2 식별자는 유지. 2026-10-14 사용자 지시로 두 사이클 모두 yaw/roll 1500 고정, shoulder/elbow pitch만 이동"}
  pwm_limits_us: [900, 2600]
  pwm_limits_source: "src/robot_arm_pkg/robot_arm_pkg/servo_protocol.py PWM_LIMITS(네 서보 모두 900~2600, 2026-10-12 확인). 가정 대응으로 각도 -0.94~+1.6 rad"
  tolerance_rad: 0.05
  hold_friction_nm: 5.0
  collision: false
  collision_source: "[가정값] 팔 링크는 시각만(충돌 없음). LiDAR 가림 U-H05 와 버튼 실제 접촉은 모델하지 않는다"
  # 팔 끝 카메라(--arm-sim --gui 실행만, robot_arm_cam.urdf). 카메라 센서는 화면(GL)이 있어야 렌더링된다.
  camera:
    xyz: [0.0, 0.0, 0.03]
    rpy: [0.0, 1.6, 0.0]
    hfov_rad: 1.13
    width: 320
    height: 240
    update_rate_hz: 6
    source: "[가정값] 사양서 '웹캠 2개 — 로봇팔 visual servoing'. 팔 끝 링크 위 3 cm 에 달려 팔 끝 축에서 아래로 약 92°(pitch 1.6 rad) 숙여 본다고 가정(2026-10-13, 사진: 팔을 세웠을 때 웹캠이 앞을 봄; 세운 팔로 바닥 택배·버튼·층 표시를 모두 보게). 실제 장착 위치·방향·화각(65° 가정)·해상도 아직 모름. 시연용 320×240·6 Hz(소프트웨어 렌더링 부하)"

parcel:
  size_m: [0.30, 0.20, 0.20]
  size_source: "[가정값] 시연 택배 규격 미정(05 준비물 '시연 택배 규격 고정')"
  carrier_offset_m: [0.25, 0.0, 0.10]
  carrier_offset_source: "[가정값] 상자가 지게팔 캐리어 앞에 얹힌다고 가정(캐리어 링크 기준)"
  locker_slot_offset_m: [0.55, 0.0, 0.40]
  locker_source: "[가정값] f1_locker 정차 자세 기준 앞 0.55 m·높이 0.40 m 에 상자가 있다고 가정. 보관함 칸 치수·위치 아직 모름 U-E07"
  mode: "attach/detach mock (충돌·질량 없음, 캐리어 자세를 따라 옮김). 실제 접촉·파지·하중 검증 아님"
  # --parcels 2|3: 첫 상자 위에 쌓아 함께 싣고 내리는 추가 상자(같은 attach/detach mock)
  stack_items:
