    digit: [[[0, 150, 120], [6, 255, 255]], [[172, 150, 120], [180, 255, 255]]]
    lamp: [[[10, 201, 150], [38, 255, 255]]]
    source: "[제안값] OpenCV HSV(H 0~180). 골판지·테이프(채도 200 이하로 주황 캐리어·호박색 램프 제외, 노란 바닥 테이프 H 24 제외), 초록 팔레트, 흰 버튼 캡(검은 버튼판 안에서만 찾음, 흰 벽과 구분), 검은 버튼판, 빨간 7-세그먼트. 시뮬 색 약속이며 실제 인식기는 아님"
  min_blob_px: 150
  lamp_match_px: 10
  button_min_px: 8
  board_min_px: 150
  digit_min_px: 15
  digit_one_max_aspect: 0.4
  parcel_mid_z_m: 0.22
  pallet_face_width_m: [0.30, 0.50]
  predock_m: 0.85
  button_protrusion_m: 0.055
  contact_radius_m: 0.025
  contact_depth_m: [-0.004, 0.06]
  source: "[제안값]/[가정값] 택배 높이 중간(팔레트 0.12+상자 절반 0.10), 팔레트 앞 0.85 m 에서 다시 보기. 버튼: 시뮬 캡 면은 LiDAR 평균 벽면에서 5.5 cm(받침대 3 cm(시뮬 전용: 지도 계단 벽 5 cm 셀을 덮음) + 판 0.5 cm + 캡 2 cm; 현장 설정은 2.5 cm), 접촉 판정 반경 2.5 cm(캡 반지름 2.75 cm 안). 팔 끝이 캡 면 0.4 cm 앞~6 cm 뒤에 있으면 눌림(면보다 더 밀면 실물은 판에 막혀 눌린 채 멈춤; 2026-10-13 벽 모양 때문에 깊이 추정이 약 2 cm 틀려 3.3 cm 밀었을 때 3 cm 상한이 누름을 놓침)"
  # 공유 상태기계(tools/jetson_skill_tests) 시뮬 설정. 현장 값은 그 폴더 config/skill_tests.yaml
