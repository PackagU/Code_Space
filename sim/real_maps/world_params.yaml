      color: [0.60, 0.44, 0.27]
    - size_m: [0.18, 0.14, 0.08]
      yaw_rad: -0.10
      color: [0.71, 0.55, 0.36]
  stack_source: "[가정값] --load box --parcels 시연용 추가 상자 규격·쌓는 방식. 실제 택배 규격·적재 방법 아직 모름"
  # --load pallet (기본): 픽업 지점 바닥 팔레트(팔레트당 택배 1개). --parcels N 이면 팔레트 N개가 놓이고 로봇은
  # 정차 자세 앞 첫 팔레트를 지게팔 캐리어로 포켓에 넣어 들어 운반·하역한다(attach/detach mock, 접촉·하중·정렬 검증 아님).
  pallet:
    size_m: [0.28, 0.40, 0.12]
    pocket_height_m: 0.10
    stringer_width_m: 0.04
    deck_boards: 5
    deck_thickness_m: 0.02
    rear_gap_m: 0.005
    fork_half_thickness_m: 0.025
    color: [0.15, 0.45, 0.25]
    pickup_right_m: 0.95
    pickup_ahead_m: 0.0
    parcel: {size_m: [0.26, 0.30, 0.20], xy: [0.0, 0.0], yaw_rad: 0.0, color: [0.66, 0.49, 0.30], source: "[가정값] 팔레트 위 택배 1개 규격(2026-10-13 깊이 0.30→0.26, 팔레트에 맞춤)"}
    waiting_offsets_m: [[0.0, 0.65], [0.0, -0.65]]
    attach_max_gap_m: 0.06
    waiting_colors: [[0.60, 0.44, 0.27], [0.71, 0.55, 0.36]]
    source: "[가정값] 2방향 초록 플라스틱 팔레트(양 끝 받침 2개, 가운데 포켓 폭 0.32 m·높이 0.10 m)를 캐리어(URDF 0.08×0.14×0.05 m)에 맞춘 시연 치수, 팔레트당 택배 1개(사용자 2026-10-12). 2026-10-13 깊이 0.40→0.28 m: 사진의 포크 길이(약 0.22 m)에 맞춤(팔레트를 실은 앞 끝 0.57→0.36 m). 위치: f1_locker 로 들어가는 방향 기준 오른쪽 0.95 m, 포켓은 f1_locker 쪽을 향함(사용자 2026-10-12). 대기 팔레트는 그 팔레트 기준 옆 0.65 m. 로봇은 카메라로 찾아 odom 으로 포켓 앞에 붙는다(perception). 실제 팔레트·택배 규격·위치 아직 모름"
  color: [0.66, 0.49, 0.30]
  look_source: "시각 표현만(골판지 색·테이프·송장). 충돌·질량 없음"

