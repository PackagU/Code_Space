  recheck_max: [0.20, 0.10, 0.2]
  confirm_by: {call: [lamp], destination: [lamp], source: "사용자 2026-10-13: 실물은 종이컵이지만 시뮬 버튼은 누르면 불이 켜진다고 가정. 요청 버튼 램프 영상만으로 누름 확인. 문/층 표시창은 누름 판정에서 제외"}
  stance_source: "[제안값] 2026-10-13 누르기는 젯슨과 같은 티칭 사이클(arm.press_cycle). 정지 자세는 사이클 누름 자세의 팔 끝(정운동학)이 버튼 면을 1 cm 지나 벽에 수직으로 닿게. 팔 끝 착지 허용: 깊이 1.2 cm·옆 2 cm·방향 0.06 rad. 높이 확인 10 cm(1 m 거리 카메라 높이 추정이 보기 자세 관절 오차 0.05 rad 때문에 ±7 cm 흔들려 3·6 cm 는 정상 버튼도 거부, 2026-10-13) — 판을 크게 잘못 붙인 경우만 거름"
  press_retries: 1
  back_off_m: 0.30
  line_up_m: 0.25
  slow_v: 0.05
  cabin_v: 0.08
  button_view_m: 1.0
  door_open_margin_m: 0.6
  door_align_m: 0.7
  door_through_m: 0.55
  door_width_m: [0.7, 1.4]
  door_lateral_tol_m: 0.12
  door_jamb_range_diff_m: 0.35
  door_match_m: 0.45
  door_match_rad: 0.45
  door_centre_tol_m: 0.03
  press_envelope_m: [0.012, 0.02, 0.06]
  floor_reconfirm_frames: 2
  approach_tol_m: 0.30
  scan_yaws_rad: [0.0, 0.35, -0.35]
  view_margin_frac: 0.15
  view_margin_source: "[제안값] 팔 카메라 자세 판정: 목표가 화면 가장자리에서 폭·높이의 15% 안쪽에 투영되면 본 것으로 함(정중앙 조준 아님). 2026-10-13 축 오차 기준(5°, 12°)은 가정 팔 기하(손목 roll 축)에서 장착점-목표 수평 0.8 m 미만이면 조준이 안 되어 실패(smoke 20261013_120120, 20261013_121143)"
  look_back_steps: 2
